# KE9ESU fork of Coil64 - automated Windows build (Qt 5.15.2 / MinGW 8.1, 64-bit)
# Coil64 (c) Valery Kustarev, GPL-3.0-or-later. This workflow only builds and packages; it does not publish releases.
name: Windows build

on:
  push:
    branches: [ ke9esu, 'ke9esu-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      PKG: Coil64-KE9ESU-win64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 + MinGW 8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Put Qt's MinGW first on PATH
        shell: pwsh
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw810_64\bin'
          if (-not (Test-Path $mingw)) { Get-ChildItem $env:IQTA_TOOLS; throw "MinGW not found at $mingw" }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (qmake + mingw32-make release)
        shell: cmd
        run: |
          where g++
          g++ --version
          qmake -v
          mkdir build
          cd build
          qmake ..\Coil64.pro CONFIG+=release CONFIG-=debug_and_release
          mingw32-make -j4

      - name: Package (windeployqt + Data folder)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter Coil64.exe | Select-Object -First 1
          if (-not $exe) { throw "Coil64.exe not found" }
          New-Item -ItemType Directory -Force $env:PKG | Out-Null
          Copy-Item $exe.FullName "$env:PKG\"
          # Use the windeployqt/qmake of the Qt we built against, not whatever is first on PATH
          $qtbin   = Join-Path $env:QT_ROOT_DIR 'bin'
          $plugins = Join-Path $env:QT_ROOT_DIR 'plugins'
          Get-Command windeployqt, qmake -All -ErrorAction SilentlyContinue | Format-Table Source
          & "$qtbin\qmake.exe" -query QT_INSTALL_PLUGINS
          Get-ChildItem "$plugins\platforms" -ErrorAction SilentlyContinue | Format-Table Name
          & "$qtbin\windeployqt.exe" --release --compiler-runtime --no-translations --dir "$env:PKG" "$env:PKG\Coil64.exe"
          Write-Host "windeployqt exit code: $LASTEXITCODE"
          # Belt and braces: make sure the platform plugin, styles, Qt DLLs and MinGW runtime are present
          foreach ($d in 'platforms','styles','imageformats','printsupport') {
            if ((Test-Path "$plugins\$d") -and -not (Test-Path "$env:PKG\$d")) {
              New-Item -ItemType Directory -Force "$env:PKG\$d" | Out-Null
              Get-ChildItem "$plugins\$d\*.dll" | Where-Object { $_.BaseName -notmatch 'd$' -or $_.BaseName -eq 'qwindowsvistastyle' } |
                Copy-Item -Destination "$env:PKG\$d\"
            }
          }
          foreach ($dll in 'Qt5Core','Qt5Gui','Qt5Network','Qt5PrintSupport','Qt5Widgets','Qt5Svg','libgcc_s_seh-1','libstdc++-6','libwinpthread-1') {
            if ((Test-Path "$qtbin\$dll.dll") -and -not (Test-Path "$env:PKG\$dll.dll")) { Copy-Item "$qtbin\$dll.dll" "$env:PKG\" }
          }
          if (-not (Test-Path "$env:PKG\platforms\qwindows.dll")) { throw "platforms\qwindows.dll missing from package" }
          # Coil64 reads the Fair-Rite material curves from <exe dir>\Data at run time
          Copy-Item -Recurse data "$env:PKG\Data"
          Copy-Item LICENSE, README.md, README_KE9ESU.md "$env:PKG\"
          Copy-Item -Recurse docs "$env:PKG\docs"
          Compress-Archive -Path "$env:PKG\*" -DestinationPath "$env:PKG.zip" -Force
          Get-ChildItem $env:PKG -Recurse -File | Format-Table FullName, Length -AutoSize
          Get-Item "$env:PKG.zip" | Format-Table Name, Length
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coil64-KE9ESU-win64
          path: Coil64-KE9ESU-win64/
          if-no-files-found: error
          retention-days: 30
